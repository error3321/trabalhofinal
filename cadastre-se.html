<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar Conta | RetroPoint</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts2.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">

</head>

<body class="login-page">

    <div class="login-container">
        <div class="logo-login">
            <a href="index.html">
                <i class="fa-solid fa-gamepad" aria-label="RetroPoint Logo"></i>
            </a>
        </div>

        <h1>Crie sua conta</h1>

        <div class="country-selector">Brasil</div>

        <form id="registerForm">

            <div class="input-group">
                <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
            </div>

            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="E-mail" required>
            </div>

            <div class="input-group password-group">
                <input type="password" id="senha" name="senha" placeholder="Senha" required>
                <span class="toggle-password" id="toggleSenha">
                    <i class="fa-solid fa-eye-slash"></i>
                </span>
            </div>

            <div class="input-group password-group">
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirmar senha" required>
                <span class="toggle-password" id="toggleConfirmarSenha">
                    <i class="fa-solid fa-eye-slash"></i>
                </span>
            </div>

            <div class="legal-text">
                Ao criar uma conta, você concorda com a
                <a href="#">Política de privacidade</a> e os
                <a href="#">Termos de uso</a> da RetroPoint.
                <br><br>
                Já possui conta?
                <a href="login.html">Faça login.</a>
            </div>

            <button type="submit" class="btn-continue">Criar conta</button>
        </form>
    </div>

    <script>
        const API_URL = "https://retro-point-be.vercel.app";

        // Funções do olho
        function configurarOlho(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);

            toggle.addEventListener("click", () => {
                const isPassword = input.type === "password";
                input.type = isPassword ? "text" : "password";

                toggle.innerHTML = isPassword
                    ? '<i class="fa-solid fa-eye"></i>'
                    : '<i class="fa-solid fa-eye-slash"></i>';
            });
        }

        configurarOlho("senha", "toggleSenha");
        configurarOlho("confirmarSenha", "toggleConfirmarSenha");

        // Envio do formulário para o backend
        document.getElementById("registerForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value.trim();
            const confirmar = document.getElementById("confirmarSenha").value.trim();

            if (senha !== confirmar) {
                alert("As senhas não coincidem.");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ nome, email, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Conta criada com sucesso!");
                    window.location.href = "login.html";
                } else {
                    alert(data.mensagem || "Erro ao criar conta.");
                }

            } catch (erro) {
                console.error("Erro:", erro);
                alert("Erro de conexão com o servidor.");
            }
        });
    </script>

</body>

</html>
