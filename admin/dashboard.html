<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard - RetroPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="../imgs/logoRP.png">

    <style>
        /* VARIÁVEIS DE TEMA */
        :root {
            --highlight-main: #3B82F6;
            /* Azul Suave (Blue 500) */
            --highlight-secondary: #60A5FA;
            /* Azul Claro (Blue 400) */
            --bg-dark: #1F2937;
            /* Fundo Principal Escuro (Gray 800) */
            --bg-sidebar: #111827;
            /* Fundo da Sidebar (Gray 900) */
            --bg-card: #283344;
            /* Fundo dos Cards (Sutilmente mais claro que o principal) */
        }

        body {
            background-color: var(--bg-dark);
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
            display: flex;
            /* Habilita layout de sidebar */
        }

        /* ---------------------------------- */
        /* Sidebar (Menu Lateral) */
        /* ---------------------------------- */
        .sidebar {
            width: 256px;
            /* 64 no tailwind (256px) */
            background-color: var(--bg-sidebar);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            position: sticky;
            top: 0;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.5);
            z-index: 50;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            color: #D1D5DB;
            /* Gray 300 */
            transition: background-color 0.2s, color 0.2s;
        }

        .sidebar-link:hover {
            background-color: #374151;
            /* Gray 700 */
            color: white;
        }

        .sidebar-link.active {
            background-color: var(--highlight-main);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* ---------------------------------- */
        /* Conteúdo Principal e Cards */
        /* ---------------------------------- */
        .main-content {
            flex-grow: 1;
            padding: 2rem 3rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* Ocupa a altura toda da tela */
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            border-left: 5px solid transparent;
            transition: transform 0.3s, border-left-color 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        /* Cores específicas para os cards */
        .card-products {
            border-left-color: #10B981;
            /* Green 500 */
        }

        .card-sales {
            border-left-color: #FBBF24;
            /* Amber 500 */
        }

        .card-revenue {
            border-left-color: var(--highlight-main);
        }

        .card-title {
            color: #9CA3AF;
            /* Gray 400 */
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 1;
        }

        /* ---------------------------------- */
        /* Atividades Recentes */
        /* ---------------------------------- */
        .activity-item {
            background-color: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #374151;
            transition: background-color 0.2s;
        }

        .activity-item:hover {
            background-color: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            /* Aumentei o espaçamento aqui */
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #374151;
            min-height: 60px;
            /* Garante uma altura mínima */
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="text-3xl font-extrabold mb-8 text-highlight-secondary">
            <i class="fas fa-gamepad mr-2"></i> RetroPoint
        </div>

        <nav class="space-y-2">
            <a href="dashboard.html" class="sidebar-link active">
                <i class="fas fa-chart-line w-6"></i>
                <span class="ml-3">Dashboard</span>
            </a>
            <a href="painel.html" class="sidebar-link">
                <i class="fas fa-box w-6"></i>
                <span class="ml-3">Produtos</span>
            </a>
            <a href="painel.html" class="sidebar-link">
                <i class="fas fa-receipt w-6"></i>
                <span class="ml-3">Vendas</span>
            </a>
            <a href="sair.html" class="sidebar-link text-red-400 hover:text-red-300">
                <i class="fas fa-sign-out-alt w-6"></i>
                <span class="ml-3">Sair</span>
            </a>
        </nav>
    </div>

    <div class="main-content">
        <header class="flex justify-between items-center pb-4 mb-8 border-b border-gray-700">
            <h1 class="text-3xl font-bold text-highlight-secondary">Visão Geral do Painel</h1>
            <div class="text-sm text-gray-400">
                <i class="fas fa-user-circle mr-2"></i>
                Usuário: <span class="font-medium text-white">Admin (Logado)</span>
            </div>
        </header>


        <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
            <div class="card card-products">
                <h3 class="card-title">Produtos cadastrados</h3>
                <div class="flex items-center justify-between">
                    <p id="total-produtos" class="card-value">...</p>
                    <i class="fas fa-boxes text-4xl text-green-500 opacity-50"></i>
                </div>
            </div>

            <div class="card card-sales">
                <h3 class="card-title">Vendas recebidas</h3>
                <div class="flex items-center justify-between">
                    <p id="total-vendas" class="card-value">...</p>
                    <i class="fas fa-handshake text-4xl text-yellow-500 opacity-50"></i>
                </div>
            </div>

            <div class="card card-revenue">
                <h3 class="card-title">Receita (estimada)</h3>
                <div class="flex items-end justify-between">
                    <div class="card-value-container">
                        <span class="currency-symbol text-green-400">R$</span>
                        <p id="receita-total" class="card-value text-green-400">0,00</p>
                    </div>
                    <i class="fas fa-dollar-sign text-4xl text-highlight-main opacity-50"></i>
                </div>
            </div>
        </section>


        <section>
            <h2 class="text-2xl font-semibold mb-6 border-b border-gray-700 pb-2">
                <i class="fas fa-bell mr-2 text-yellow-500"></i>
                Atividades Recentes
            </h2>

            <div id="lista-atividades" class="activity-list space-y-3">
                <p class="text-gray-500 text-sm">Carregando atividades...</p>
            </div>
        </section>

        <footer class="mt-20 py-6 text-center text-sm text-gray-500 border-t border-gray-700">
            © RetroPoint — Painel Administrativo
        </footer>
    </div>


    <script>
        const API_BASE = "https://retro-point-be.vercel.app";
        const token = localStorage.getItem("token");

        async function atualizarDashboard() {
            try {
                // Busca Produtos
                const resProdutos = await fetch(`${API_BASE}/produto`);
                const produtos = await resProdutos.json();

                document.getElementById('total-produtos').textContent = produtos.length;

                atualizarAtividades();

                // Busca Vendas
                const resVendas = await fetch(`${API_BASE}/venda`);
                const vendas = await resVendas.json();
                document.getElementById('total-vendas').textContent = vendas.length;

                // CALCULA RECEITA
                const receita = produtos.reduce((acc, p) => acc + parseFloat(p.preco || 0), 0);
                document.getElementById('receita-total').textContent = new Intl.NumberFormat('pt-BR', {
                    minimumFractionDigits: 2
                }).format(receita);

                // Formata apenas o número (sem o símbolo R$)
                const valorFormatado = new Intl.NumberFormat('pt-BR', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(receita);

                await atualizarAtividades();

            } catch (error) {
                console.error("Erro ao carregar dados:", error);
            }
        }

        // Chama a função ao abrir a página
        atualizarDashboard();

        async function atualizarAtividades() {
            try {
                const res = await fetch(`${API_BASE}/atividades`);
                const logs = await res.json();

                const lista = document.getElementById('lista-atividades');
                lista.innerHTML = '';

                // Se o banco retornar vazio, mostra a mensagem
                if (!logs || logs.length === 0) {
                    lista.innerHTML = '<div class="activity-item"><span>Nenhuma atividade registrada no sistema.</span></div>';
                    return;
                }

                logs.forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'activity-item';

                    // FORMATAÇÃO DO TEMPO
                    const dataLog = new Date(log.data_criacao);
                    const horario = dataLog.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                    item.innerHTML = `
                        <span class="text-gray-200">${log.descricao}</span>
                        <span class="text-sm text-gray-400 whitespace-nowrap ml-4">
                            <i class="far fa-clock mr-1"></i> ${horario}
                        </span>
                    `;
                    lista.appendChild(item);
                });
            } catch (error) {
                console.error("Erro ao carregar logs:", error);
            }
        }
    </script>

</body>

</html>
