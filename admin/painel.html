<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - RetroPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --highlight-main: #3B82F6;
            --highlight-secondary: #60A5FA;
            --bg-dark: #1F2937;
            --bg-card: #374151;
        }

        body {
            background-color: var(--bg-dark);
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
        }

        header {
            border-color: var(--highlight-main);
        }

        .add-btn {
            background-color: var(--highlight-main);
            color: white;
            font-weight: 600;
            transition: background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .add-btn:hover {
            background-color: var(--highlight-secondary);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
        }

        .admin-table th {
            background-color: #4B5563;
            color: #D1D5DB;
            text-transform: uppercase;
            font-weight: 600;
        }

        .table-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #6B7280;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--bg-card);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .modal-content input,
        .modal-content textarea {
            background-color: #4B5563;
            border: 1px solid #6B7280;
            color: white;
        }
    </style>
</head>

<body class="p-4 sm:p-8">

    <header
        class="w-full bg-gray-900 text-white shadow-lg mb-8 py-4 px-6 flex justify-between items-center rounded-xl border">
        <div class="flex items-center space-x-4">
            <div class="text-2xl font-bold tracking-wide">RetroPoint • Admin</div>
            <div class="text-sm text-gray-400">Usuário: <span id="accountName"
                    class="font-medium text-highlight-secondary">Carregando...</span></div>
        </div>
        <nav class="space-x-6 text-lg">
            <a href="dashboard.html" class="hover:text-highlight-main transition">Dashboard</a>
            <a href="sair.html" id="signOutLink" class="hover:text-gray-400 transition font-semibold">Sair</a>
        </nav>
    </header>

    <main class="p-4 sm:p-8">
        <section class="mb-12">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold text-highlight-secondary">Produtos</h2>
                <button id="addProductBtn" class="add-btn px-4 py-2 rounded-lg">
                    <i class="fas fa-plus mr-2"></i> Adicionar Produto
                </button>
            </div>

            <div class="overflow-x-auto rounded-lg shadow-xl">
                <table class="min-w-full divide-y divide-gray-700 admin-table">
                    <thead>
                        <tr>
                            <th class="px-4 py-3 text-left text-xs tracking-wider">Imagem</th>
                            <th class="px-4 py-3 text-left text-xs tracking-wider">Nome</th>
                            <th class="px-4 py-3 text-left text-xs tracking-wider">Preço</th>
                            <th class="px-4 py-3 text-center text-xs tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-gray-700 bg-gray-800">
                        <tr>
                            <td colspan="4" class="text-center py-4">Iniciando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div id="productModal" class="modal-overlay fixed inset-0 hidden items-center justify-center p-4">
            <div class="modal-content w-full max-w-lg p-6 rounded-xl">
                <h3 id="modalTitle" class="text-2xl font-bold mb-6 text-highlight-main border-b border-gray-600 pb-2">
                    Adicionar Novo Produto</h3>
                <form id="productForm">
                    <input type="hidden" id="productId" name="productId">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1 text-gray-300">Nome do Produto*</label>
                        <input type="text" id="productName" required class="w-full p-2 rounded-lg focus:outline-none">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1 text-gray-300">Preço (R$)*</label>
                        <input type="number" step="0.01" id="productPrice" required
                            class="w-full p-2 rounded-lg focus:outline-none">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1 text-gray-300">URL da Imagem</label>
                        <input type="url" id="productImage" class="w-full p-2 rounded-lg focus:outline-none"
                            placeholder="https://...">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium mb-1 text-gray-300">Descrição</label>
                        <textarea id="productDesc" rows="3" class="w-full p-2 rounded-lg focus:outline-none"></textarea>
                    </div>
                    <div class="flex justify-end space-x-4">
                        <button type="button" id="cancelBtn"
                            class="bg-gray-500 text-white px-4 py-2 rounded-lg">Cancelar</button>
                        <button type="submit" class="add-btn px-4 py-2 rounded-lg">Salvar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // 1. CONSTANTES E ESTADO GLOBAL
        const API_BASE = "https://retro-point-be.vercel.app";
        const token = localStorage.getItem("token");

        // 2. REFERÊNCIAS DO DOM (DEFINIDAS NO TOPO PARA EVITAR REFERENCE ERROR)
        const productModal = document.getElementById('productModal');
        const addProductBtn = document.getElementById('addProductBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const productForm = document.getElementById('productForm');
        const productTableBody = document.getElementById("productTableBody");
        const accountNameSpan = document.getElementById("accountName");

        // 3. PROTEÇÃO DE ACESSO
        if (!token) window.location.href = "../login.html";

        function decodeToken(t) {
            try {
                return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            } catch (e) { return null; }
        }

        const user = decodeToken(token);
        if (!user || user.role !== 'admin') {
            localStorage.removeItem("token");
            window.location.href = "../login.html";
        } else {
            accountNameSpan.textContent = user.email.split("@")[0];
        }

        // 4. FUNÇÕES DO MODAL
        function openModal(isEdit = false) {
            if (!isEdit) {
                productForm.reset();
                document.getElementById("productId").value = "";
                document.getElementById("modalTitle").textContent = "Adicionar Novo Produto";
            }
            productModal.classList.remove("hidden");
            productModal.classList.add("flex");
        }

        function closeModal() {
            productModal.classList.add("hidden");
            productModal.classList.remove("flex");
        }

        // 5. OPERAÇÕES CRUD
        async function carregarProdutos() {
            productTableBody.innerHTML = `<tr><td colspan="4" class="text-center py-4">Carregando...</td></tr>`;
            try {
                // Note que usamos /produto (ou a rota que você definiu para listar)
                const res = await fetch(`${API_BASE}/produto`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!res.ok) throw new Error(`Erro ${res.status}`);

                const produtos = await res.json();
                productTableBody.innerHTML = "";

                produtos.forEach(p => {
                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-gray-700 border-b border-gray-700";
                    tr.innerHTML = `
                    <td class="px-4 py-4"><img src="${p.imagem || 'https://placehold.co/60x60'}" class="table-img"></td>
                    <td class="px-4 py-4">${p.nome}</td>
                    <td class="px-4 py-4">R$ ${Number(p.preco).toFixed(2)}</td>
                    <td class="px-4 py-4 text-center">
                        <button class="bg-yellow-500 text-black px-3 py-1 text-sm rounded mr-2 btn-edit"><i class="fas fa-edit"></i> Editar</button>
                        <button class="bg-red-600 text-white px-3 py-1 text-sm rounded btn-del"><i class="fas fa-trash"></i> Excluir</button>
                    </td>
                `;
                    // Vincula os eventos aos botões
                    tr.querySelector(".btn-edit").onclick = () => prepararEdicao(p);
                    tr.querySelector(".btn-del").onclick = () => excluirProduto(p.id_produto);
                    productTableBody.appendChild(tr);
                });
            } catch (err) {
                productTableBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-400">Erro: ${err.message}. Verifique o banco de dados.</td></tr>`;
            }
        }

        //6. PREPARAR EDIÇÃO
        function prepararEdicao(p) {
            openModal(true);
            document.getElementById("modalTitle").textContent = "Editar Produto";
            // IMPORTANTE: Garantir que estamos usando id_produto
            document.getElementById("productId").value = p.id_produto;
            document.getElementById("productName").value = p.nome;
            document.getElementById("productPrice").value = p.preco;
            document.getElementById("productImage").value = p.imagem || "";
            document.getElementById("productDesc").value = p.descricao || "";
        }

        //7. Salvar (Adicionar ou Atualizar)
        productForm.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById("productId").value;
            const data = {
                nome: document.getElementById("productName").value,
                preco: parseFloat(document.getElementById("productPrice").value),
                imagem: document.getElementById("productImage").value,
                descricao: document.getElementById("productDesc").value
            };

            const url = id ? `${API_BASE}/produto/update/${id}` : `${API_BASE}/produto/add`;
            const method = id ? "PUT" : "POST";

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert(id ? "Produto atualizado!" : "Produto adicionado!");
                    closeModal();
                    carregarProdutos();
                } else {
                    const erro = await res.json();
                    alert("Erro no servidor: " + (erro.message || erro.error));
                }
            } catch (err) {
                alert("Erro de conexão com o servidor.");
            }
        };

        //8. Excluir Produto
        async function excluirProduto(id) {
            if (!confirm("Tem certeza que deseja excluir este produto?")) return;
            try {
                const res = await fetch(`${API_BASE}/produto/delete/${id}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (res.ok) {
                    alert("Produto excluído!");
                    carregarProdutos();
                } else {
                    alert("Erro ao excluir. Verifique o console.");
                }
            } catch (err) { alert("Erro de rede."); }
        }

        // Eventos de Botões
        addProductBtn.onclick = () => openModal(false);
        cancelBtn.onclick = closeModal;

        // Inicialização
        carregarProdutos();

        // Colocar produtos cadastrados na página oficial
        async function cadastrarProduto() {
            const produto = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                imagem: document.getElementById('imagem').value
            };

            // Envia para o seu backend que está conectado ao Neon
            const resposta = await fetch('/api/produtos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(produto)
            });

            if (resposta.ok) {
                alert("Produto cadastrado no Neon com sucesso!");
            }
        }

    </script>
</body>

</html>
