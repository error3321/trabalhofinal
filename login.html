<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar ou Cadastrar | RetroPoint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts2.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body class="login-page">
    <div class="login-container">

        <div class="logo-login">
            <a href="index.html">
                <i class="fa-solid fa-gamepad" aria-label="RetroPoint Logo"></i>
            </a>
        </div>

        <h1>
            Insira seus dados para entrar ou criar sua conta
        </h1>

        <div class="country-selector">
            Brasil
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="E-mail" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Senha" required>
            </div>

            <a href="#" class="forgot-password">Esqueceu sua senha?</a>

            <div class="legal-text">
                Ao continuar, afirmo que concordo com a
                <a href="#">Política de privacidade</a> e os
                <a href="#">Termos de uso</a> da RetroPoint.
            </div>

            <button type="submit" id="continueBtn" class="btn-continue">
                Continuar
            </button>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        const redirectToPainel = () => window.location.href = 'admin/painel.html';
        const redirectToHome = () => window.location.href = 'index.html';

        async function handleLogin(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                alert("Preencha e-mail e senha.");
                return;
            }

            try {
                const response = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Armazena token no localStorage
                    localStorage.setItem("token", data.token);

                    // Redireciona conforme o papel do usuário
                    if (data.role === "admin") {
                        redirectToPainel();
                    } else {
                        redirectToHome();
                    }
                } else {
                    alert(data.message || "Erro ao fazer login. Verifique suas credenciais.");
                }

            } catch (err) {
                console.error("Erro de rede:", err);
                alert("Erro de rede. Tente novamente mais tarde.");
            }
        }

        loginForm.addEventListener("submit", handleLogin);

        // Proteção: se já estiver logado, redireciona
        window.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            if (token) {
                // Aqui você poderia decodificar o JWT e redirecionar conforme role
                // Para simplificar, envia para home
                redirectToHome();
            }
        });
    </script>
</body>

</html>
