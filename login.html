<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar ou Cadastrar | RetroPoint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts2.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="logo-login"><a href="index.html"><i class="fa-solid fa-gamepad"
                    aria-label="RetroPoint Logo"></i></a></div>
        <h1>Insira seus dados para entrar ou criar sua conta</h1>
        <div class="country-selector">Brasil</div>

        <form id="loginForm">
            <div class="input-group"><input type="email" id="email" name="email" placeholder="E-mail" required></div>
            <div class="input-group"><input type="password" id="password" name="password" placeholder="Senha" required>
            </div>
            <a href="#" class="forgot-password">Esqueceu sua senha?</a>
            <div class="legal-text">Ao continuar, afirmo que concordo com a <a href="#">Política de privacidade</a> e os
                <a href="#">Termos de uso</a> da RetroPoint.
            </div>
            <button type="submit" id="continueBtn" class="btn-continue">Continuar</button>
        </form>
    </div>

    <script>
        /*
          Configure aqui:
          - API_OVERRIDE: opcional — use só se expôs seu backend com ngrok ou tem a URL pública do deploy.
            Exemplos:
              null                          -> usar localhost (quando estiver desenvolvendo)
              "https://abcd-5501.ngrok.io"  -> ngrok (para testar página hospedada apontando para seu backend local)
              "https://meu-backend.onrender.com" -> URL do deploy (produção)
        */
// coloque exatamente esta linha no topo do script
        const API_OVERRIDE = "https://super-space-pancake-wrj6wv5g555259jq-5502.app.github.dev";
        const LOCAL_PORTS_TO_TRY = [5502, 5501, 3000];      // portas locais a tentar

        function detectApiBase() {
            if (API_OVERRIDE) return API_OVERRIDE.replace(/\/+$/, ""); // remove slash final
            if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
                return `http://localhost:${LOCAL_PORTS_TO_TRY[0]}`;
            }
            // Se não colocou API_OVERRIDE e não está em localhost, não temos backend público configurado.
            // Substitua abaixo pela URL do seu backend quando fizer deploy.
            return null;
        }

        const API_BASE = detectApiBase(); // null se não configurado

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const redirectToPainel = () => window.location.href = 'admin/painel.html';
        const redirectToHome = () => window.location.href = 'index.html';

        // tenta sequencialmente várias URLs até obter resposta de rede (não apenas 4xx/5xx)
        async function tryFetchWithFallbacks(urls, fetchOptions) {
            for (const url of urls) {
                try {
                    const res = await fetch(url, fetchOptions);
                    return res; // se chegou aqui, conexão feita (mesmo 401 etc)
                } catch (err) {
                    console.warn(`Falha de rede em ${url}:`, err);
                }
            }
            throw new Error("Todas as tentativas de conexão falharam (network error).");
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || !password) { alert("Preencha e-mail e senha."); return; }

            // montar a lista de endpoints a tentar
            // montar a lista de endpoints a tentar
            const endpoints = [];

            if (API_OVERRIDE) {
                endpoints.push(`${API_OVERRIDE.replace(/\/+$/, "")}/login`);
            }

            // ambiente local
            if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
                for (const p of LOCAL_PORTS_TO_TRY) {
                    endpoints.push(`http://localhost:${p}/login`);
                }
            }

            // ambiente hospedado (deploy)
            if (API_BASE && !API_OVERRIDE && !(location.hostname === "localhost")) {
                endpoints.push(`${API_BASE}/login`);
            }

            // 👇 ADICIONE AQUI: DEBUG IMPORTANTE
            console.log("Endpoints que serão testados:", endpoints);

            try {
                const response = await tryFetchWithFallbacks(endpoints, options);
                const data = await response.json().catch(() => ({}));

                if (response.ok && data.token) {
                    localStorage.setItem("token", data.token);

                    // decodifica token para role (se presente)
                    try {
                        const payload = JSON.parse(atob(data.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                        if (payload.role === 'admin') return redirectToPainel();
                    } catch (_) { /* ignora se token não decodificar */ }

                    return redirectToHome();
                } else {
                    alert(data.message || data.error || `Erro ao fazer login (status ${response.status}).`);
                }
            } catch (err) {
                console.error("Erro de rede (todas as tentativas):", err);
                alert("Erro de rede. Não foi possível conectar ao backend. Verifique se o servidor está rodando (localhost) ou use ngrok/URL pública.");
            }
        }

        loginForm.addEventListener("submit", handleLogin);

        // redirecionamento se já logado
        window.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            if (!token) return;
            try {
                const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                if (payload.role === 'admin') redirectToPainel();
                else redirectToHome();
            } catch (_) { }
        });
    </script>
</body>

</html>
