<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar ou Cadastrar | RetroPoint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts2.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">

</head>

<body class="login-page">
    <div class="login-container">
        <div class="logo-login">
            <a href="index.html"><i class="fa-solid fa-gamepad" aria-label="RetroPoint Logo"></i></a>
        </div>

        <h1>Insira seus dados para entrar ou criar sua conta</h1>

        <div class="country-selector">Brasil</div>

        <form id="loginForm">

            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="E-mail" required>
            </div>

            <!-- AQUI ESTÁ O CAMPO DE SENHA COM O OLHO -->
            <div class="input-group password-group">
                <input type="password" id="password" name="password" placeholder="Senha" required>
                <span class="toggle-password" id="togglePassword">
                    <i class="fa-solid fa-eye-slash"></i>
                </span>
            </div>

            <a href="#" class="forgot-password">Esqueceu sua senha?</a>

            <div class="legal-text">
                Primeira vez aqui? 
                <a href="cadastre-se.html">Crie uma conta.</a>
                <br><br>
                Ao continuar, afirmo que concordo com a
                <a href="#">Política de privacidade</a> e os <a href="#">Termos de uso</a> da RetroPoint.
            </div>

            <button type="submit" id="continueBtn" class="btn-continue">Continuar</button>
        </form>
    </div>

    <script>
        /* CONFIG */
        const API_OVERRIDE = "https://retro-point-be.vercel.app";
        const LOCAL_PORTS_TO_TRY = [5502, 5501, 3000];

        function detectApiBase() {
            if (API_OVERRIDE) return API_OVERRIDE.replace(/\/+$/, "");
            if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
                return `http://localhost:${LOCAL_PORTS_TO_TRY[0]}`;
            }
            return null;
        }
        const API_BASE = detectApiBase();

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        const redirectToPainel = () => window.location.href = 'admin/painel.html';
        const redirectToHome = () => window.location.href = 'index.html';

        async function tryFetchWithFallbacks(urls, fetchOptions) {
            for (const url of urls) {
                try {
                    console.log("Tentando endpoint:", url);
                    const res = await fetch(url, fetchOptions);
                    return res;
                } catch (err) {
                    console.warn(`Falha de rede em ${url}:`, err);
                }
            }
            throw new Error("Todas as tentativas de conexão falharam (network error).");
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || !password) { alert("Preencha e-mail e senha."); return; }

            const endpoints = [];
            if (API_OVERRIDE) endpoints.push(`${API_OVERRIDE.replace(/\/+$/, "")}/login`);

            if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
                for (const p of LOCAL_PORTS_TO_TRY) endpoints.push(`http://localhost:${p}/login`);
            }

            if (API_BASE && !API_OVERRIDE && !(location.hostname === "localhost")) {
                endpoints.push(`${API_BASE}/login`);
            }

            console.log("Endpoints que serão testados:", endpoints);
            if (!endpoints.length) { alert("Nenhum endpoint configurado."); return; }

            const options = {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Cache-Control": "no-cache",
                    "Pragma": "no-cache"
                },
                cache: "no-store",
                mode: "cors",
                body: JSON.stringify({ email, senha: password })
            };

            try {
                const response = await tryFetchWithFallbacks(endpoints, options);
                const text = await response.text().catch(() => "");

                let data = {};
                if (text && text.trim() !== "") {
                    try { data = JSON.parse(text); } catch { data = {}; }
                }

                if (response.ok && data.token) {
                    localStorage.setItem("token", data.token);
                    try {
                        const payload = JSON.parse(atob(data.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                        if (payload.role === 'admin') return redirectToPainel();
                    } catch { }
                    return redirectToHome();
                }

                alert(data.message || data.error || `Erro ao fazer login (status ${response.status}).`);

            } catch (err) {
                console.error("Erro de rede:", err);
                alert("Erro de rede. Não foi possível conectar ao backend.");
            }
        }

        loginForm.addEventListener("submit", handleLogin);

        window.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            if (!token) return;
            try {
                const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                if (payload.role === 'admin') redirectToPainel(); else redirectToHome();
            } catch { }
        });

        /* --- SCRIPT DO OLHO DE MOSTRAR/OCULTAR SENHA --- */
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";

            togglePassword.innerHTML = isPassword
                ? '<i class="fa-solid fa-eye"></i>'
                : '<i class="fa-solid fa-eye-slash"></i>';
        });
    </script>

</body>

</html>
